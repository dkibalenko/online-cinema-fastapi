services:
  db:
    image: 'postgres:16'
    container_name: postgres_cinema
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_cinema_data:/var/lib/postgresql/data/
    networks:
      - fastapi_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_cinema
    ports:
      - "3333:80"
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_cinema_data:/var/lib/pgadmin
    networks:
      - fastapi_network

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: cinema-nginx
    ports:
      - "8080:80"  # http://localhost:8080
      - "8443:443"  # https://localhost:8443
      # - "80:80"
      # - "443:443"  # make sure SSL server block is reachable
    depends_on:
      - web
    networks:
      - fastapi_network

  web:
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: backend_fastapi
    command: ["/bin/bash", "/commands/run.sh"]
    env_file:
      - ../.env
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/usr/src/fastapi
      - WATCHFILES_FORCE_POLLING=true 
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src:/usr/src/fastapi/src
      - ../alembic.ini:/usr/src/alembic.ini:ro
      - ../alembic:/usr/src/alembic:ro
      - ../logs:/var/log/app
    networks:
      - fastapi_network
    stdin_open: true
    tty: true

  migrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: alembic_migrator_cinema
    command: ["/bin/bash", "/commands/run_migrations.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src:/usr/src/fastapi
      - ../alembic.ini:/usr/src/alembic.ini:ro
      - ../alembic:/usr/src/alembic:ro
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/usr/src/fastapi
    networks:
      - fastapi_network

  mailhog:
    restart: always
    build:
      context: ..
      dockerfile: docker/mailhog/Dockerfile
    container_name: cinema-mailhog
    command: ["/bin/bash", "-c", "/commands/setup_mailhog_auth.sh && /go/bin/MailHog"]
    ports:
      - "8025:8025"  # listen for Web UI
      - "1025:1025"  # listen for plain SMTP (no TLS)
    env_file:
      - ../.env
    environment:
      MH_AUTH_FILE: /mailhog.auth
    networks:
      - fastapi_network

  minio:
    image: minio/minio:latest
    container_name: cinema-minio
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ../.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi_network

  minio_mc:
    build:
      context: ..
      dockerfile: docker/minio_mc/Dockerfile
    container_name: cinema-minio_mc
    command: ["/bin/sh", "-c", "/commands/setup_minio.sh"]
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - fastapi_network

  redis:
    image: redis:7
    container_name: cinema-redis
    ports:
      - "6379:6379"
    networks:
      - fastapi_network

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: cinema-worker
    command: celery -A cinema_celery.celery_app worker --loglevel=info -E # -E for dev. remove for prod
    volumes:
      - ../src:/usr/src/fastapi
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    environment:
      - PYTHONPATH=/usr/src/fastapi
    networks:
      - fastapi_network

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: cinema-beat
    command: celery -A cinema_celery.celery_app beat --loglevel=info
    volumes:
      - ../src:/usr/src/fastapi
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    environment:
      - PYTHONPATH=/usr/src/fastapi
    networks:
      - fastapi_network

  flower:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: cinema-flower
    command: celery -A cinema_celery.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    environment:
      - PYTHONPATH=/usr/src/fastapi
    networks:
        - fastapi_network

volumes:
  postgres_cinema_data:
    driver: local
  pgadmin_cinema_data:
    driver: local
  minio_data:
    driver: local

networks:
  fastapi_network:
    driver: bridge
