[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
follow_imports = silent
strict_optional = True

# FastAPI dependency injection often confuses mypy
[mypy-fastapi.*]
ignore_missing_imports = True

# SQLAlchemy async models
[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-sqlalchemy.orm.*]
ignore_errors = True

# Celery
[mypy-celery.*]
ignore_missing_imports = True

# Redis
[mypy-redis.*]
ignore_missing_imports = True

# Alembic
[mypy-alembic.*]
ignore_errors = True

[mypy-alembic.versions.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True
