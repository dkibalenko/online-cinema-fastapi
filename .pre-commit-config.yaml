repos:
  # -----------------------------
  # Ruff (lint + format)
  # -----------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: ["--config=pyproject.toml", "--fix"]  # auto-fix lint issues
      - id: ruff-format  # enforce formatting
        args: ["--config=pyproject.toml"]

  # -----------------------------
  # Mypy type checking
  # -----------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: ["--config-file=mypy.ini"]
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - types-aiofiles
          - alembic

  # -----------------------------
  # Pytest (optional)
  # -----------------------------
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: poetry run pytest -q
        language: system
        pass_filenames: true
